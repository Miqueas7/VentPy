name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Suite C++ en las tres plataformas y en ambas configuraciones. Debug y
  # Release se ejecutan por separado porque la optimizacion puede alterar el
  # comportamiento en coma flotante, y varias pruebas verifican fronteras
  # normativas exactas.
  cpp:
    name: C++ ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -DVENTPY_BUILD_TESTS=ON -DVENTPY_BUILD_PYTHON=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Compilar
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Ejecutar pruebas
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # AddressSanitizer y UndefinedBehaviorSanitizer. El compilador de Windows no
  # ofrece UBSan, de modo que este trabajo es el unico lugar donde se detecta
  # comportamiento indefinido (lecturas sin inicializar, desbordes, division
  # entre cero, conversiones invalidas).
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar con sanitizers
        env:
          FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g -O1
        run: |
          cmake -S . -B build-san \
            -DVENTPY_BUILD_TESTS=ON -DVENTPY_BUILD_PYTHON=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
      - name: Compilar
        run: cmake --build build-san --parallel
      - name: Ejecutar pruebas bajo sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure

  # Cobertura de lineas y ramas del nucleo. El umbral evita que la cobertura
  # caiga sin que nadie lo note; se mide solo include/ventpy (la libreria),
  # excluyendo pruebas y dependencias externas.
  coverage:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Configurar con instrumentacion
        run: |
          cmake -S . -B build-cov \
            -DVENTPY_BUILD_TESTS=ON -DVENTPY_BUILD_PYTHON=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Compilar y ejecutar
        run: |
          cmake --build build-cov --parallel
          ctest --test-dir build-cov --output-on-failure
      - name: Medir y comprobar umbral
        run: |
          lcov --capture --directory build-cov --output-file cov.info \
               --rc branch_coverage=1 --ignore-errors mismatch,gcov,source
          lcov --extract cov.info "*/include/ventpy/*" --output-file cov-core.info \
               --rc branch_coverage=1 --ignore-errors unused
          lcov --list cov-core.info --rc branch_coverage=1
          LINES=$(lcov --summary cov-core.info --rc branch_coverage=1 2>&1 | grep -oP 'lines\.+: \K[0-9.]+')
          echo "Cobertura de lineas del nucleo: $LINES %"
          awk -v v="$LINES" 'BEGIN { if (v+0 < 85.0) { print "Por debajo del umbral (85%)"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: cov-core.info

  # Suite Python contra la extension compilada, en las tres plataformas.
  # Incluye las pruebas basadas en propiedades, que generan sus propios casos.
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el paquete con sus extras de prueba
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Ejecutar la suite
        run: python -m pytest tests/python -q
      - name: Ejecutar las pruebas de escala
        run: python -m pytest tests/python -q -m slow
      - name: Comprobar la interfaz de linea de comandos
        run: |
          ventpy --help
          ventpy lmp --norma peru
